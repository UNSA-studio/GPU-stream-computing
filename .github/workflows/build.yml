name: build

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.8'
      - name: Build
        run: gradle build --no-daemon --stacktrace
      - name: Publish jar to dist
        run: |
          mkdir -p dist
          cp build/libs/*.jar dist/gpusc.jar
          git config user.email UNSA-studio@outlook.com
          git config user.name UNSA-Studio
          git add dist
          git diff --cached --quiet || git commit -m "chore: publish gpusc.jar"
          git push
      - uses: actions/upload-artifact@v4
        with:
          name: gpusc-jar
          path: build/libs/*.jar
